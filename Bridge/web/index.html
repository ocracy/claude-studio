<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Claude Studio">
  <meta name="theme-color" content="#1c1c1e">
  <!-- use-credentials: the manifest lives behind the bridge's token, and a
       manifest fetched without cookies comes back 401 — which Chrome reports as
       "no manifest" and quietly downgrades the install to a browser shortcut. -->
  <link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
  <!-- iOS ignores SVG here; without a PNG the Home Screen icon is a screenshot. -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
  <title>Claude Studio</title>
</head>
<body>

<!-- ── Tab list ─────────────────────────────────────────────────────────── -->
<section id="list" class="view">
  <header class="bar">
    <h1>Claude Studio</h1>
    <button id="open-menu" class="icon" title="Menu" aria-label="Menu">☰</button>
  </header>

  <!-- Shown when the Mac is serving a newer interface than this phone loaded.
       Installed to the Home Screen there is no browser reload to fall back on. -->
  <button id="update-banner" class="banner hidden">A newer version is ready — tap to update</button>

  <div id="projects" class="scroll"></div>

  <footer class="bar bottom">
    <button id="compose" class="primary">New Claude session</button>
  </footer>
</section>

<!-- ── One session ──────────────────────────────────────────────────────── -->
<section id="session" class="view hidden">
  <header class="bar">
    <button id="back" class="icon" aria-label="Back">‹</button>
    <div class="title">
      <span id="session-name"></span>
      <small id="session-project"></small>
    </div>
    <span id="session-state" class="dot"></span>
    <!-- Shift+Tab is how Claude Code cycles permission modes. -->
    <button id="mode" class="mode" data-key="BTab" title="Cycle mode (Shift+Tab)">mode ⇧⇥</button>
  </header>

  <!-- Above the terminal, not below it: the on-screen keyboard covers the
       bottom of the screen, and keys you cannot reach while typing are keys you
       cannot use. There is no message box — the terminal takes the keyboard
       directly, so a second place to type would only be in the way. -->
  <div class="keys">
    <button data-key="Escape">esc</button>
    <button data-key="BSpace" aria-label="Backspace">⌫</button>
    <button data-newline="1" aria-label="New line">⇧⏎</button>
    <button data-key="Left" aria-label="Left">←</button>
    <button data-key="Down" aria-label="Down">↓</button>
    <button data-key="Up" aria-label="Up">↑</button>
    <button data-key="Right" aria-label="Right">→</button>
    <button data-key="Tab">tab</button>
    <button data-key="1">1</button>
    <button data-key="2">2</button>
    <button data-key="3">3</button>
    <button data-key="C-c" class="warn">^C</button>
  </div>

  <!-- The real terminal, served by ttyd through the bridge's /term proxy.
       Swiping over it scrolls tmux's scrollback; see attachScrollGesture. -->
  <div id="term-host"></div>
</section>

<!-- ── Menu ─────────────────────────────────────────────────────────────── -->
<div id="menu" class="sheet hidden">
  <div class="sheet-body">
    <h2>Claude Studio</h2>
    <div class="actions vertical">
      <button id="menu-refresh">Refresh sessions</button>
      <button id="menu-update">Update the app</button>
      <button id="menu-settings">Notifications &amp; settings</button>
      <button id="menu-cancel">Cancel</button>
    </div>
    <p id="menu-build" class="group-note"></p>
  </div>
</div>

<!-- ── Per-session actions ──────────────────────────────────────────────── -->
<div id="actions" class="sheet hidden">
  <div class="sheet-body">
    <h2 id="actions-title">Session</h2>
    <div class="actions vertical">
      <button id="action-close" class="danger">Close tab</button>
      <button id="action-cancel">Cancel</button>
    </div>
  </div>
</div>

<!-- ── New session sheet ────────────────────────────────────────────────── -->
<div id="sheet" class="sheet hidden">
  <div class="sheet-body">
    <h2>New Claude session</h2>

    <label>Project
      <select id="new-project"></select>
    </label>

    <label>Name
      <input id="new-name" type="text" placeholder="Claude" autocapitalize="sentences">
    </label>

    <label>First task <span class="hint">optional</span>
      <textarea id="new-prompt" rows="3" placeholder="What should Claude do?"></textarea>
    </label>

    <label class="row">
      <input id="new-background" type="checkbox">
      <span>Start now in the background<small>Runs on the Mac without waiting for you to open the terminal.</small></span>
    </label>

    <div class="actions">
      <button id="new-cancel">Cancel</button>
      <button id="new-create" class="primary">Create</button>
    </div>
  </div>
</div>

<!-- ── Settings ─────────────────────────────────────────────────────────── -->
<section id="settings" class="view hidden">
  <header class="bar">
    <button id="settings-back" class="icon" aria-label="Back">‹</button>
    <h1>Settings</h1>
  </header>

  <div class="scroll">
    <h2 class="group">App</h2>
    <p id="install-note" class="group-note">Checking…</p>
    <div class="setting-actions">
      <button id="install" class="primary hidden">Install as an app</button>
    </div>

    <h2 class="group">Notifications</h2>

    <label class="setting">
      <span>
        Notify me on this phone
        <small id="push-note">Get a notification when a session finishes and needs you.</small>
      </span>
      <input id="push-enabled" type="checkbox">
    </label>

    <label class="setting" id="push-silent-row">
      <span>
        Silent
        <small>No sound or vibration — the notification still appears.
          The tone itself is chosen in Android's settings for this app, not here.</small>
      </span>
      <input id="push-silent" type="checkbox">
    </label>

    <div id="push-projects-wrap" class="hidden">
      <h2 class="group">Which projects</h2>
      <p class="group-note">All of them, unless you pick.</p>
      <div id="push-projects"></div>
    </div>

    <div class="setting-actions">
      <button id="push-test">Send a test notification</button>
      <button id="push-repair">Re-register this phone</button>
    </div>
  </div>
</section>

<div id="toast" class="toast hidden"></div>

<script src="/app.js" type="module"></script>
</body>
</html>
