<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Claude Studio">
  <meta name="theme-color" content="#1c1c1e">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
  <title>Claude Studio</title>
</head>
<body>

<!-- ── Tab list ─────────────────────────────────────────────────────────── -->
<section id="list" class="view">
  <header class="bar">
    <h1>Claude Studio</h1>
    <button id="refresh" class="icon" title="Refresh" aria-label="Refresh">⟳</button>
  </header>

  <div id="projects" class="scroll"></div>

  <footer class="bar bottom">
    <button id="compose" class="primary">New Claude session</button>
  </footer>
</section>

<!-- ── One session ──────────────────────────────────────────────────────── -->
<section id="session" class="view hidden">
  <header class="bar">
    <button id="back" class="icon" aria-label="Back">‹</button>
    <div class="title">
      <span id="session-name"></span>
      <small id="session-project"></small>
    </div>
    <span id="session-state" class="dot"></span>
  </header>

  <!-- The real terminal, served by ttyd through the bridge's /term proxy. -->
  <iframe id="term" title="Terminal"></iframe>

  <footer class="composer">
    <div class="keys">
      <button data-key="1">1</button>
      <button data-key="2">2</button>
      <button data-key="3">3</button>
      <button data-key="Escape">esc</button>
      <button data-key="Up">↑</button>
      <button data-key="C-c" class="warn">^C</button>
      <button id="kill" class="warn right">Close tab</button>
    </div>
    <div class="input">
      <textarea id="prompt" rows="1" placeholder="Message Claude…"
                enterkeyhint="send" autocapitalize="sentences"></textarea>
      <button id="send" class="primary" aria-label="Send">↑</button>
    </div>
  </footer>
</section>

<!-- ── New session sheet ────────────────────────────────────────────────── -->
<div id="sheet" class="sheet hidden">
  <div class="sheet-body">
    <h2>New Claude session</h2>

    <label>Project
      <select id="new-project"></select>
    </label>

    <label>Name
      <input id="new-name" type="text" placeholder="Claude" autocapitalize="sentences">
    </label>

    <label>First task <span class="hint">optional</span>
      <textarea id="new-prompt" rows="3" placeholder="What should Claude do?"></textarea>
    </label>

    <label class="row">
      <input id="new-background" type="checkbox">
      <span>Start now in the background<small>Runs on the Mac without waiting for you to open the terminal.</small></span>
    </label>

    <div class="actions">
      <button id="new-cancel">Cancel</button>
      <button id="new-create" class="primary">Create</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/app.js" type="module"></script>
</body>
</html>
